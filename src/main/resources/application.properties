spring.application.name=spring-boot-service-consumer

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Kafka Configuration
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.consumer.group-id=transaction-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=transaction:com.namsan.consumer.model.Transaction
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Resilience4j Configuration
# Circuit Breaker
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.ringBufferSizeInClosedState=10
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.ringBufferSizeInHalfOpenState=3
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.waitDurationInOpenState=30000
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.recordExceptions=java.lang.Exception

# Retry Configuration
resilience4j.retry.instances.transactionServiceRetry.maxAttempts=3
resilience4j.retry.instances.transactionServiceRetry.waitDuration=2000
resilience4j.retry.instances.transactionServiceRetry.enableExponentialBackoff=true
resilience4j.retry.instances.transactionServiceRetry.exponentialBackoffMultiplier=2

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.registerHealthIndicator=true
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.limitForPeriod=100
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.timeoutDuration=5s

# Caching Configuration
spring.cache.type=simple

# Logging Configuration
logging.level.root=INFO
logging.level.com.namsan.consumer=DEBUG
logging.level.org.springframework.kafka=INFO

