spring.application.name=spring-boot-service-consumer

# Server Configuration
server.port=0
server.servlet.context-path=/api

# H2 Database Configuration (In-memory for testing)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
# Disable data.sql loading for tests
spring.sql.init.mode=never

# Kafka Configuration
spring.kafka.bootstrap-servers=127.0.0.1:9092
spring.kafka.consumer.group-id=test-transaction-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=transaction:com.namsan.consumer.model.Transaction
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.ringBufferSizeInClosedState=10
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.ringBufferSizeInHalfOpenState=3
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.waitDurationInOpenState=5000
resilience4j.circuitbreaker.instances.transactionServiceCircuitBreaker.failureRateThreshold=50

resilience4j.retry.instances.transactionServiceRetry.maxAttempts=2
resilience4j.retry.instances.transactionServiceRetry.waitDuration=1000

resilience4j.ratelimiter.instances.transactionServiceRateLimiter.registerHealthIndicator=true
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.limitForPeriod=1000
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.transactionServiceRateLimiter.timeoutDuration=5s

# Caching Configuration
spring.cache.type=simple

# Logging Configuration
logging.level.root=WARN
logging.level.com.namsan.consumer=DEBUG
logging.level.org.springframework.kafka=WARN

